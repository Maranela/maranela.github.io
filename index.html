<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feminist Guard PRO v6.6 Fixed</title>
<style>
  :root { --bg:#1e1025; --card:#fff8f0; --primary:#2a1840; }
  body { background:var(--bg); font-family:sans-serif; margin:0; padding:12px; }
 .card { background:var(--card); border-radius:24px; padding:18px; margin-bottom:16px; }
  input { width:100%; padding:14px; border:2px solid #000; border-radius:12px; margin:6px 0; font-size:16px; box-sizing:border-box; }
 .btn { width:100%; padding:14px; border-radius:12px; border:none; font-weight:bold; font-size:16px; cursor:pointer; }
 .btn-dark { background:#2a1840; color:#f5e6c8; }
 .btn-light { background:#fff; border:2px solid #000; }
 .error { background:#ffd6d6; color:#a00; padding:10px; border-radius:8px; display:none; }
 .success { background:#d6ffd6; color:#060; padding:10px; border-radius:8px; display:none; }
 .contact-item { display:flex; justify-content:space-between; background:#fff; padding:10px; border-radius:10px; margin:6px 0; }
  #addContactPage { display:none; }
</style>
</head>
<body>

<div id="authPage" class="card">
  <h1 style="text-align:center">🛡️ Feminist Guard PRO</h1>
  <p style="text-align:center">v6.6 Fixed • POPIA Safe</p>
  <div style="display:flex;gap:8px">
    <button class="btn btn-dark" onclick="showLogin()">Login</button>
    <button class="btn btn-light" onclick="showCreate()">Create</button>
  </div>
  <div id="loginError" class="error"></div>
  <input id="idInput" placeholder="SA ID - 13 digits" maxlength="13" type="tel">
  <div id="idMsg" style="font-size:12px"></div>
  <input id="fullNameInput" placeholder="Full name" style="display:none">
  <input id="usernameInput" placeholder="Username">
  <input id="passwordInput" type="password" placeholder="Password min 6">
  <label><input type="checkbox" id="popiaCheck"> POPIA: store only last 4 - I agree</label>
  <button class="btn btn-dark" onclick="handleCreate()">Verify ID & Create 🔒</button>
  <button class="btn btn-dark" id="loginBtn" onclick="handleLogin()" style="margin-top:8px">Unlock Protection 🔒</button>
</div>

<div id="homePage" class="card" style="display:none">
  <h2>Hello, <span id="userDisplay"></span> ✓</h2>
  <button class="btn btn-dark" onclick="startSafeTrip()">▶ Start Safe Trip</button>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn" style="background:#ffd6e0" onclick="triggerSOS()">🚨 SOS</button>
    <button class="btn" style="background:#e0e0ff" onclick="toggleHide()">🧮 Hide</button>
    <button class="btn" style="background:#fff0a0" onclick="openVault()">🔐 Vault</button>
  </div>
  <div id="sosStatus" style="margin-top:10px;background:#ddd;padding:8px;border-radius:8px"></div>
  <button class="btn btn-light" onclick="openContacts()" style="margin-top:10px">👥 Trusted Contacts</button>
  <button class="btn btn-light" onclick="logout()" style="border-color:red;color:red;margin-top:8px">🚪 Log Out</button>
</div>

<div id="contactsPage" class="card" style="display:none">
  <h3>👥 Trusted Contacts</h3>
  <div id="contactsList"></div>
  <button class="btn btn-dark" onclick="openAddContactPage()">+ Add Contact</button>
  <button class="btn btn-light" onclick="showHome()">← Back Home</button>
</div>

<div id="addContactPage" class="card">
  <h3>Add New Trusted Contact</h3>
  <input id="cName" placeholder="Name e.g. Rose">
  <input id="cNumber" placeholder="Number e.g. 0672739660" type="tel">
  <div id="cError" class="error"></div>
  <button class="btn btn-dark" onclick="saveContact()">+ Save Contact</button>
  <button class="btn btn-light" onclick="closeAddContactPage()">Cancel</button>
</div>

<div id="vaultPage" class="card" style="display:none">
  <h3>🔐 Evidence Vault</h3>
  <p id="vaultInfo">No recordings yet. Panic will auto-record 60s.</p>
  <div id="vaultList"></div>
  <button class="btn btn-dark" onclick="showHome()">← Back</button>
</div>

<script>
function isValidSAID(id){
  if(!/^\d{13}$/.test(id)) return {valid:false, reason:"Must be 13 digits"};
  let month=parseInt(id.substring(2,4));
  let day=parseInt(id.substring(4,6));
  if(month<1||month>12) return {valid:false, reason:"Invalid month"};
  if(day<1||day>31) return {valid:false, reason:"Invalid day"};
  let sum=0;
  for(let i=0;i<12;i++){
    let d=parseInt(id[i]);
    if(i%2===0) sum+=d;
    else { let dd=d*2; sum+=dd>9?dd-9:dd; }
  }
  let check=(10-(sum%10))%10;
  if(check!=parseInt(id[12])) return {valid:false, reason:"Invalid checksum"};
  return {valid:true};
}
document.getElementById('idInput').addEventListener('input', e=>{
  let v=e.target.value.replace(/\D/g,'');
  e.target.value=v;
  let msg=document.getElementById('idMsg');
  let res=isValidSAID(v);
  if(v.length===0) msg.textContent='';
  else if(v.length<13){ msg.textContent=v.length+'/13'; msg.style.color='orange'; }
  else if(!res.valid){ msg.textContent='❌ '+res.reason; msg.style.color='red'; }
  else { msg.textContent='✅ Valid - will save...'+v.slice(-4); msg.style.color='green'; }
});
let currentUser=null;
function showLogin(){ document.getElementById('fullNameInput').style.display='none'; }
function showCreate(){ document.getElementById('fullNameInput').style.display='block'; }
function handleCreate(){
  let id=document.getElementById('idInput').value;
  let name=document.getElementById('fullNameInput').value;
  let user=document.getElementById('usernameInput').value;
  let pass=document.getElementById('passwordInput').value;
  let popia=document.getElementById('popiaCheck').checked;
  let chk=isValidSAID(id);
  if(!chk.valid){ alert(chk.reason); return; }
  if(!popia){ alert('Agree to POPIA'); return; }
  if(pass.length<6){ alert('Password min 6'); return; }
  let users=JSON.parse(localStorage.getItem('fg_users')||'{}');
  if(users[user]){ alert('Username exists, login'); return; }
  users[user]={idHash:btoa(id).slice(0,20), idLast4:id.slice(-4), fullName:name, pass:pass};
  localStorage.setItem('fg_users', JSON.stringify(users));
  alert('Account created! Now login');
  showLogin();
}
function handleLogin(){
  let errBox=document.getElementById('loginError');
  errBox.style.display='none';
  localStorage.removeItem('login_failed');
  let user=document.getElementById('usernameInput').value;
  let pass=document.getElementById('passwordInput').value;
  if(!user||!pass){ errBox.textContent='Enter username and password'; errBox.style.display='block'; return; }
  let users=JSON.parse(localStorage.getItem('fg_users')||'{}');
  let found=users[user];
  if(!found||found.pass!==pass){
    errBox.textContent='❌ Wrong password! Try again';
    errBox.style.display='block';
    setTimeout(()=>{
      errBox.style.display='none';
      document.getElementById('passwordInput').value='';
      document.getElementById('passwordInput').focus();
    },1500);
    return;
  }
  currentUser=user;
  localStorage.setItem('fg_current', user);
  showHome();
}
function showHome(){
  document.getElementById('authPage').style.display='none';
  document.getElementById('contactsPage').style.display='none';
  document.getElementById('addContactPage').style.display='none';
  document.getElementById('vaultPage').style.display='none';
  document.getElementById('homePage').style.display='block';
  document.getElementById('userDisplay').textContent=localStorage.getItem('fg_current')||'user';
  renderContacts();
  let last=localStorage.getItem('fg_lastSOS');
  if(last) document.getElementById('sosStatus').innerHTML='✅ 📍 '+last;
}
function logout(){ localStorage.removeItem('fg_current'); location.reload(); }
function openContacts(){ document.getElementById('homePage').style.display='none'; document.getElementById('contactsPage').style.display='block'; }
function openAddContactPage(){ document.getElementById('contactsPage').style.display='none'; document.getElementById('addContactPage').style.display='block'; document.getElementById('cName').value=''; document.getElementById('cNumber').value=''; }
function closeAddContactPage(){ document.getElementById('addContactPage').style.display='none'; document.getElementById('contactsPage').style.display='block'; }
function saveContact(){
  let name=document.getElementById('cName').value.trim();
  let num=document.getElementById('cNumber').value.trim().replace(/\D/g,'');
  let err=document.getElementById('cError');
  err.style.display='none';
  if(name.length<2){ err.textContent='Name too short'; err.style.display='block'; return; }
  if(num.length<10){ err.textContent='Number must be 10 digits'; err.style.display='block'; return; }
  let list=JSON.parse(localStorage.getItem('fg_contacts')||'[]');
  list.push({name, number:num});
  localStorage.setItem('fg_contacts', JSON.stringify(list));
  closeAddContactPage();
  renderContacts();
}
function renderContacts(){
  let list=JSON.parse(localStorage.getItem('fg_contacts')||'[]');
  let html='';
  list.forEach((c,i)=>{
    html+='<div class="contact-item"><span>👤 '+c.name+' - '+c.number+'</span><button onclick="deleteContact('+i+')">🗑️</button></div>';
  });
  document.getElementById('contactsList').innerHTML=html||'<p>No contacts yet</p>';
}
function deleteContact(i){
  let list=JSON.parse(localStorage.getItem('fg_contacts')||'[]');
  list.splice(i,1);
  localStorage.setItem('fg_contacts', JSON.stringify(list));
  renderContacts();
}
let mediaRecorder, recordedChunks=[];
async function triggerSOS(){
  let contacts=JSON.parse(localStorage.getItem('fg_contacts')||'[]');
  if(contacts.length===0){ alert('Add trusted contacts first!'); openContacts(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    mediaRecorder=new MediaRecorder(stream);
    recordedChunks=[];
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop=()=>{
      let blob=new Blob(recordedChunks,{type:'video/webm'});
      let vault=JSON.parse(localStorage.getItem('fg_vault')||'[]');
      vault.push({date:new Date().toLocaleString(), size:blob.size});
      localStorage.setItem('fg_vault', JSON.stringify(vault.slice(-5)));
      document.getElementById('vaultInfo').textContent='Evidence saved! '+vault.length+' clips';
    };
    mediaRecorder.start();
    setTimeout(()=>{
      if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
      stream.getTracks().forEach(t=>t.stop());
    },60000);
  }catch(e){ console.log('Camera blocked', e); }
  let posText='Location unavailable';
  try{
    let pos=await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true, timeout:8000}));
    posText='https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude;
  }catch(e){}
  let time=new Date().toLocaleString();
  let msg='🚨 FEMINIST GUARD PRO - HELP! I am in danger! Time: '+time+' Location: '+posText;
  let lastSOS='SOS fallback - '+time+' | '+posText;
  localStorage.setItem('fg_lastSOS', lastSOS);
  document.getElementById('sosStatus').innerHTML='✅ 📍 '+lastSOS;
  contacts.forEach(c=>{
    let num=c.number.startsWith('0')?'27'+c.number.slice(1):c.number;
    window.open('sms:'+c.number+'?body='+encodeURIComponent(msg), '_blank');
    setTimeout(()=> window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg), '_blank'), 800);
  });
  alert('✅ SOS SENT to '+contacts.length+' contacts! Recording started.');
}
function openVault(){
  document.getElementById('homePage').style.display='none';
  document.getElementById('vaultPage').style.display='block';
  let vault=JSON.parse(localStorage.getItem('fg_vault')||'[]');
  let html=vault.map(v=>'<div style="background:#fff;padding:8px;border-radius:8px;margin:6px 0">📹 '+v.date+' - '+v.size+' bytes</div>').join('');
  document.getElementById('vaultList').innerHTML=html||'No evidence yet';
}
function startSafeTrip(){ alert('Safe Trip ON'); }
function toggleHide(){ document.body.style.display='none'; setTimeout(()=>{ document.body.style.display='block'; },500); }
window.onload=()=>{
  let cur=localStorage.getItem('fg_current');
  if(cur) showHome();
  renderContacts();
};
</script>
</body>
</html>
