<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feminist-Guard v34 PROFESSIONAL LUXURY - OWNER ONLY PAYMENTS FIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#0e0a1e;color:#f5e9c8;padding:12px;padding-bottom:90px}
.card{background:#1a1430;border:1px solid #e8d48b66;border-radius:20px;padding:16px;margin-top:12px}
.gold{color:#e8d48b;font-weight:900}
.pink{background:#ff2e63;color:white;border:none;padding:16px;border-radius:14px;width:100%;font-weight:900;font-size:16px;cursor:pointer}
.goldbtn{background:#e8d48b;color:#1a1430;border:none;padding:16px;border-radius:14px;width:100%;font-weight:900;font-size:16px;cursor:pointer}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#211c38;color:#e8d48b;margin-top:8px;font-size:14px}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#211c38;color:#a99dc2;font-weight:800;cursor:pointer;text-align:center}
.tab-active{border:2px solid #e8d48b;background:#3a325c;color:#e8d48b}
.badge{display:inline-block;background:rgba(232,212,139,0.15);border:1px solid rgba(232,212,139,0.3);border-radius:10px;padding:4px 10px;font-size:10px;color:#e8d48b;margin-top:6px}
.status-pending{background:#ffbe0b;color:#000;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:900}
.status-approved{background:#00d68f;color:#000;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:900}
.status-rejected{background:#ff3b30;color:white;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:900}
.bottom{position:fixed;bottom:8px;left:8px;right:8px;background:#231d3e;border-radius:20px;display:flex;justify-content:space-around;padding:8px 4px;z-index:99;border:1px solid #ffffff1a}
.nav{padding:8px 6px;border-radius:12px;font-size:10px;text-align:center;color:#a99dc2;cursor:pointer;position:relative}
.nav-active{background:#3a325c;color:#e8d48b}
.nav-locked{opacity:0.35}
.nav-locked::after{content:'🔒';position:absolute;top:-2px;right:0;font-size:10px}
.hidden{display:none!important}
.msg{padding:12px;border-radius:12px;margin-top:12px;font-weight:700;text-align:center;font-size:13px}
.ok{background:rgba(0,214,143,0.15);border:1px solid rgba(0,214,143,0.4);color:#00d68f}
.err{background:rgba(255,59,48,0.15);border:1px solid rgba(255,59,48,0.4);color:#ff8a8a}
.warn{background:rgba(255,190,11,0.15);border:1px solid rgba(255,190,11,0.4);color:#ffbe0b}
.lock-overlay{background:rgba(0,0,0,0.85);border:2px solid #ff3b30;border-radius:20px;padding:20px;text-align:center;margin-top:12px}
.lock-card{opacity:0.25;pointer-events:none;filter:grayscale(1)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.media-item{border-radius:14px;overflow:hidden;background:#211c38;border:1px solid #e8d48b44;padding:8px}
.media-item img,.media-item video{width:100%;border-radius:10px}
.media-btn{background:#3a325c;border:1px solid #e8d48b66;color:#e8d48b;padding:14px;border-radius:14px;font-weight:900;cursor:pointer;text-align:center}
</style>
</head>
<body>
<div style="max-width:420px;margin:0 auto">
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;gap:12px;align-items:center">
<div id="avatarLetter" style="width:52px;height:52px;border-radius:50%;background:#e8d48b;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px">F</div>
<div><h1 class="gold" style="line-height:18px;font-size:20px">Feminist-<br>Guard</h1><p style="font-size:11px;opacity:0.7">Welcome, <span id="welcomeName">Guest</span></p><span class="badge">v34 PROFESSIONAL — OWNER ONLY PAYMENTS FIX + v15.7 + VAULT MEDIA</span></div>
</div>
<div style="text-align:right"><div id="activeBadge" style="background:#ff3b30;color:white;font-size:10px;font-weight:900;padding:6px 10px;border-radius:20px">NOT ACTIVE</div><button id="logoutBtn" onclick="logout()" class="hidden" style="margin-top:6px;background:rgba(255,255,255,0.1);border:none;color:white;padding:6px 10px;border-radius:20px;font-size:10px">Logout</button></div>
</div>
